[package]
name = "orc-thief-bevy"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18.1", default-features = false, features = ["2d", "ui"] }
bevy_ecs_tiled = "0.12.0"
bevy-inspector-egui = { version = "0.36.0", optional = true }

[features]
default = ["debug"]
debug = ["dep:bevy-inspector-egui"]

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
