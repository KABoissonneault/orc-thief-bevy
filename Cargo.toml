[package]
name = "orc-thief-bevy"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18.1", default-features = false, features = ["2d"] }
bevy_ecs_tiled = "0.12.0"
bevy-inspector-egui = { version = "0.36.0", optional = true }
# 0.34 only supported in bevy 0.19
egui = { version = "0.33.3", optional = true }

[features]
default = ["dev_native"]
dev_native = [
    "dev",
    "bevy/file_watcher",
    "bevy/embedded_watcher",
]
dev = [
    "dep:egui",
    "dep:bevy-inspector-egui",
    "bevy/dev",
    "bevy/bevy_ui_debug",
    "bevy/track_location",
]

[lints.clippy]
# Bevy supplies arguments to systems via dependency injection, so it's natural for systems to
# request more than 7 arguments, which would undesirably trigger this lint.
too_many_arguments = "allow"
# Queries may access many components, which would undesirably trigger this lint.
type_complexity = "allow"
# Make sure macros use their standard braces, such as `[]` for `bevy_ecs::children!`.
nonstandard_macro_braces = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Actuall Wasm release, which is what Trunk will build
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "debuginfo"

[profile.release-native]
inherits = "release"
opt-level = 3
strip = "none"

# Used by bevy CLI for `bevy run web`
[profile.web-release]
inherits = "release"
